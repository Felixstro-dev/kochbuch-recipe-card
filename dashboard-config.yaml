# Home Assistant Lovelace – Kochbuch Recipe Card
# Beispielkonfigurationen für das kochbuch-Backend

# WICHTIG: base_url auf die Adresse deines Backends setzen
# (die IP/Port, unter der Home Assistant das Backend erreicht).

# Kleine Karte – Ideen-Ansicht (Standard)
type: custom:ha-recipe-card
base_url: "http://192.168.1.20:8080"
mode: ideas
filter_web_only: true
search_query: "Backen"
show_shopping_list: true

