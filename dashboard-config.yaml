# Home Assistant Lovelace – Kochbuch Recipe Card
# Beispielkonfigurationen für das Kochbuch-Backend

# WICHTIG: base_url = LAN-IP des Rechners, auf dem das Backend läuft.
# Nicht die Home-Assistant-IP verwenden!

# Kleine Karte – Ideen-Ansicht
type: custom:ha-recipe-card
base_url: "http://192.168.30.9:8080"
mode: ideas
filter_web_only: false
search_query: "Backen"
limit: 10
show_shopping_list: true

